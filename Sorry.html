<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorry Chhiku 🥺</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5);
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 420px;
    padding: 35px 20px;
    text-align: center;
    background: white;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.emoji {
    font-size: 65px;
}

h1 {
    color: #ff4f81;
}

.message {
    font-size: 19px;
    line-height: 1.7;
    color: #444;
}

.buttons {
    position: relative;
    height: 100px;
    margin-top: 20px;
}

button {
    padding: 13px 24px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
}

.yes {
    background: #ff4f81;
    color: white;
}

.no {
    background: #ddd;
    color: #333;
    position: absolute;
    left: 55%;
    top: 10px;
}

#thankyou {
    display: none;
    margin-top: 20px;
    font-size: 22px;
    color: #ff477e;
    font-weight: bold;
}

.heart {
    position: absolute;
    font-size: 22px;
    animation: float 5s linear forwards;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }

    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="emoji">🥺</div>

    <h1>Sorry Chhiku ❤️</h1>

    <div class="message">
        <p><b>Me prt kadhich nahi krnar asa prank.</b></p>

        <p>
            <b>I am sorry 😭❤️</b>
        </p>

        <p>
            Please forgive me 🥺👉👈
        </p>
    </div>

    <div class="buttons">

        <button class="yes" onclick="forgive()">
            Kiya 😭❤️
        </button>

        <button class="no" id="noBtn"
                onmouseover="moveButton()"
                onclick="moveButton()">
            Nahi Kiya 😤
        </button>

    </div>

    <div id="thankyou">
        Thank You Chhiku ❤️😭<br><br>
        Promise 🤞<br>
        Ab parat asa prank nahi karnaar! 🥺❤️
    </div>

</div>

<script>

function moveButton() {

    const button = document.getElementById("noBtn");

    const maxX = window.innerWidth - button.offsetWidth - 20;
    const maxY = window.innerHeight - button.offsetHeight - 20;

    const x = Math.max(10, Math.random() * maxX);
    const y = Math.max(10, Math.random() * maxY);

    button.style.position = "fixed";
    button.style.left = x + "px";
    button.style.top = y + "px";
}

function forgive() {

    document.getElementById("thankyou").style.display = "block";

    for (let i = 0; i < 25; i++) {

        setTimeout(() => {

            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);

        }, i * 80);
    }
}

</script>

</body>
</html>
